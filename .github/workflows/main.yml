name: 自动同步上游仓库
on:
  # 北京时间每日8点自动同步
  schedule:
    - cron: '0 0 * * *'
  # 支持手动一键触发同步
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 同步上游源仓库
        uses: dabreadman/sync-upstream-repo@v1.3.0
        with:
          upstream_repo: dobot-arm/dobot-atom-sdk
          target_branch: main
